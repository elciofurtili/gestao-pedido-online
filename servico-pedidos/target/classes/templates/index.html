<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Serviço de Pedidos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Criar Novo Pedido</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <form action="#" th:action="@{/criar-pedido}" th:object="${pedido}" method="post">
                    <div class="mb-3">
                        <label for="id" class="form-label">ID do Pedido</label>
                        <input type="number" class="form-control" th:field="*{id}" id="id" required />
                    </div>
                    <div class="mb-3">
                        <label for="nomeCliente" class="form-label">Nome do Cliente</label>
                        <input type="text" class="form-control" th:field="*{nomeCliente}" id="nomeCliente" required />
                    </div>
                    <div class="mb-3">
                        <label for="valor" class="form-label">Valor</label>
                        <input type="text" class="form-control" th:field="*{valor}" id="valor" required />
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enviar Pedido</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
