<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5">
    <title>Serviço de Faturamento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Pedidos Faturados</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(pedidos)}">
                    <p class="text-center text-muted">Aguardando novos pedidos para faturamento...</p>
                </div>
                <table class="table table-striped" th:unless="${#lists.isEmpty(pedidos)}">
                    <thead>
                        <tr>
                            <th>ID do Pedido</th>
                            <th>Nome do Cliente</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td th:text="${pedido.id}">1</td>
                            <td th:text="${pedido.nomeCliente}">Cliente</td>
                            <td th:text="${#numbers.formatCurrency(pedido.valor)}">R$ 0,00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <p class="text-center text-muted mt-3">Esta página atualiza automaticamente a cada 5 segundos.</p>
    </div>
</body>
</html>
